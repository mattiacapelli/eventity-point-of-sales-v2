version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=/data/pos.db
      - DEBUG=false
    volumes:
      - pos-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  printer-agent:
    build:
      context: .
      dockerfile: apps/printer-agent/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  pos-data:
